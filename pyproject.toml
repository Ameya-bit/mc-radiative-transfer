[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrt"
version = "0.9.12"
description = "Monte Carlo radiative transfer through a plane-parallel neutron star atmosphere"
requires-python = ">=3.10"
# Floors match the pinned production versions in requirements.txt (numpy 2.4.4,
# matplotlib 3.10.9); bit-for-bit MC reproduction requires those exact pins.
dependencies = [
    "numpy>=2.4",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]
